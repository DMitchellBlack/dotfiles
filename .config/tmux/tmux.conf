# See: https://man7.org/linux/man-pages/man1/tmux.1.html#OPTIONS

# Default terminal inside tmux panes
set -g default-terminal "tmux-256color"

# Enable modern terminal capabilities for xterm derivatives (Ghostty)
# (RGB truecolor, cursor shapes/colors, styles underlines, hyperlinks, focus reporting, clipboard sync)
set -as terminal-features ",xterm*:RGB:cstyle:ccolour:usstyle:hyperlinks:focus:clipboard:sync"

# Allow tools to copy local clipboard via OSC 52
set -s set-clipboard on

# Pass terminal focus events (focus in / focus out) to tools
set -s focus-events on

# Mouse support and scrollback history
set -g mouse on
set -g history-limit 10000

# Activity & Bell monitoring
set -g monitor-activity on
set -g bell-action any

# Allow programs in the pane to bypass tmux using a terminal escape sequence
# Used for Kitty / Ghostty image protocol graphics
set -g allow-passthrough on

# Remove delay when pressing <Esc> in Neovim and Zsh vi-mode
set -s escape-time 0
