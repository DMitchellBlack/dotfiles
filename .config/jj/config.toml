#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "D. Mitchell Black"
email = "dmitchellblack@gmail.com"

[ui]
editor = "nvim"
default-command = "log"
diff-editor = ":builtin"

[aliases]
nv-diffedit = ["diffedit", "--tool", "nvim-difftool"]

[merge-tools.nvim-difftool]
program = "nvim"
edit-args = ["-c", "packadd nvim.difftool", "-d", "$left", "$right"]
diff-args = [] # Enforce that tool is invalid for generating diffs
